[package]
name = "anime-game-core"
version = "1.37.0"
authors = ["Nikita Podvirnyi <krypt0nn@vk.com>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/an-anime-team/an-anime-game-launcher"
repository = "https://github.com/an-anime-team/an-anime-game-launcher"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[dependencies.sophon-tools]
git = "https://dawn.wine/dawn-winery/sophon-tools"
package = "sophon-lib"

[build-dependencies]
protobuf-codegen = { version = "3.7.2", optional = true }
